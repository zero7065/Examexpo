<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ep-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B16"/>
      <stop offset="0.55" stop-color="#141127"/>
      <stop offset="1" stop-color="#0A1A22"/>
    </linearGradient>
    <linearGradient id="ep-neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C3CE9"/>
      <stop offset="0.55" stop-color="#9B59B6"/>
      <stop offset="1" stop-color="#00E5A0"/>
    </linearGradient>
    <linearGradient id="ep-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#D4A853"/>
    </linearGradient>
    <radialGradient id="ep-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6C3CE9" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6C3CE9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6C3CE9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ep-clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#ep-clip)">
    <rect width="512" height="512" fill="url(#ep-bg)"/>
    <rect width="512" height="512" fill="url(#ep-glow)"/>

    <!-- circuit traces -->
    <g stroke="#6C3CE9" stroke-opacity="0.35" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M40 120 H96 V168"/>
      <path d="M472 392 H416 V344"/>
      <circle cx="96" cy="176" r="10" fill="#6C3CE9" fill-opacity="0.5" stroke="none"/>
      <circle cx="416" cy="336" r="10" fill="#00E5A0" fill-opacity="0.5" stroke="none"/>
    </g>

    <!-- open book base -->
    <path d="M128 368 Q192 344 256 368 Q320 344 384 368 L384 392 Q320 368 256 392 Q192 368 128 392 Z"
          fill="#1E1B33" stroke="#9B59B6" stroke-width="8" stroke-linejoin="round"/>

    <!-- E letterform: spine + three neon bars -->
    <rect x="148" y="108" width="44" height="212" rx="22" fill="url(#ep-neon)"/>
    <rect x="148" y="108" width="196" height="44" rx="22" fill="url(#ep-neon)"/>
    <rect x="148" y="204" width="232" height="44" rx="22" fill="url(#ep-gold)"/>
    <rect x="148" y="300" width="172" height="20" rx="10" fill="url(#ep-neon)" opacity="0.9"/>

    <!-- scan beam on the middle bar -->
    <rect x="148" y="204" width="232" height="44" rx="22" fill="#FFFFFF" opacity="0.18"/>

    <!-- bot eye node -->
    <circle cx="392" cy="130" r="34" fill="#0B0B16" stroke="url(#ep-gold)" stroke-width="10"/>
    <circle cx="392" cy="130" r="12" fill="url(#ep-gold)"/>

    <!-- ripple rings -->
    <g fill="none" stroke="#00E5A0" stroke-width="7">
      <circle cx="392" cy="130" r="54" opacity="0.55"/>
      <circle cx="392" cy="130" r="78" opacity="0.28"/>
      <circle cx="392" cy="130" r="102" opacity="0.12"/>
    </g>
  </g>
</svg>
