<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ep2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120C"/>
      <stop offset="0.55" stop-color="#10241A"/>
      <stop offset="1" stop-color="#0A141E"/>
    </linearGradient>
    <linearGradient id="ep2-sage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E7A4E"/>
      <stop offset="0.55" stop-color="#6A9A6A"/>
      <stop offset="1" stop-color="#8FCE8F"/>
    </linearGradient>
    <linearGradient id="ep2-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#D4A853"/>
    </linearGradient>
    <radialGradient id="ep2-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6A9A6A" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#6A9A6A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6A9A6A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ep2-clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#ep2-clip)">
    <rect width="512" height="512" fill="url(#ep2-bg)"/>
    <rect width="512" height="512" fill="url(#ep2-glow)"/>

    <!-- circuit traces (brand purple) -->
    <g stroke="#6C3CE9" stroke-opacity="0.4" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M40 120 H96 V168"/>
      <path d="M472 392 H416 V344"/>
      <circle cx="96" cy="176" r="10" fill="#6C3CE9" fill-opacity="0.55" stroke="none"/>
      <circle cx="416" cy="336" r="10" fill="#D4A853" fill-opacity="0.6" stroke="none"/>
    </g>

    <!-- open book base -->
    <path d="M128 368 Q192 344 256 368 Q320 344 384 368 L384 392 Q320 368 256 392 Q192 368 128 392 Z"
          fill="#12261A" stroke="#6A9A6A" stroke-width="8" stroke-linejoin="round"/>

    <!-- E letterform: sage spine + bars -->
    <rect x="148" y="108" width="44" height="212" rx="22" fill="url(#ep2-sage)"/>
    <rect x="148" y="108" width="196" height="44" rx="22" fill="url(#ep2-sage)"/>
    <rect x="148" y="204" width="232" height="44" rx="22" fill="url(#ep2-gold)"/>
    <rect x="148" y="300" width="172" height="20" rx="10" fill="url(#ep2-sage)" opacity="0.9"/>
    <rect x="148" y="204" width="232" height="44" rx="22" fill="#FFFFFF" opacity="0.16"/>

    <!-- bot eye node -->
    <circle cx="392" cy="130" r="34" fill="#07120C" stroke="url(#ep2-gold)" stroke-width="10"/>
    <circle cx="392" cy="130" r="12" fill="url(#ep2-gold)"/>

    <!-- ripple rings (sage) -->
    <g fill="none" stroke="#8FCE8F" stroke-width="7">
      <circle cx="392" cy="130" r="54" opacity="0.55"/>
      <circle cx="392" cy="130" r="78" opacity="0.28"/>
      <circle cx="392" cy="130" r="102" opacity="0.12"/>
    </g>
  </g>
</svg>
